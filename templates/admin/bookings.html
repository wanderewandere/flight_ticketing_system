{% extends 'base.html' %}

{% block content %}

<h2>All Bookings</h2>

<table border="1">

<tr>
    <th>Reference</th>
    <th>Passenger</th>
    <th>Flight</th>
    <th>Passengers</th>
    <th>Total Cost</th>
    <th>Status</th>
</tr>

{% for booking in bookings %}

<tr>
    <td>{{ booking[0] }}</td>
    <td>{{ booking[1] }}</td>
    <td>{{ booking[2] }}</td>
    <td>{{ booking[3] }}</td>
    <td>{{ booking[4] }}</td>
    <td>{{ booking[5] }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
